spring.application.name=backend

# ------------------------------------------------------------------
# Base de données PostgreSQL (développement via docker compose up)
# Port hôte 5433 pour éviter le conflit avec un PostgreSQL local sur 5432
# ------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kfokam48}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kfokam48}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kfokam48}

# ------------------------------------------------------------------
# JPA — le schéma est géré par Flyway, Hibernate ne fait que valider
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# Flyway — migrations versionnées (ENF5)
# ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------
# Serveur
# ------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
